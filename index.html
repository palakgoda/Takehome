<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TakeHome</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F1F4EF; --surface:#FFFFFF; --ink:#16231E; --muted:#5C6B64; --line:#DAE1DA;
  --forest:#14573F; --on-forest:#FFFFFF; --saffron:#E58A1F; --saffron-soft:#FBE7C8; --brick:#B03A2A;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#0E1512; --surface:#16201B; --ink:#E7EEE9; --muted:#9AAAA2; --line:#263129;
  --forest:#3FB17F; --on-forest:#07140E; --saffron:#F2A33A; --saffron-soft:#3A2C12; --brick:#E4705F;
}}
*{box-sizing:border-box}
html{color-scheme:light dark}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 Figtree,system-ui,"Segoe UI",sans-serif}
h1,h2,.brand,.figure,.coin{font-family:"Bricolage Grotesque",Figtree,system-ui,sans-serif;letter-spacing:-.02em}
h2{font-size:19px;margin:0 0 14px;font-weight:700}
.muted{color:var(--muted)}
:focus-visible{outline:3px solid color-mix(in srgb,var(--saffron) 60%,transparent);outline-offset:2px}

/* top loading bar: only for things you start yourself */
#bar{position:fixed;inset:0 0 auto 0;height:3px;overflow:hidden;opacity:0;transition:opacity .2s;z-index:50}
body.loading #bar{opacity:1}
#bar::after{content:"";position:absolute;inset:0;width:35%;background:var(--saffron);animation:slide 1.1s ease-in-out infinite}
@keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(300%)}}

.top{max-width:1120px;margin:0 auto;padding:20px 24px;display:flex;justify-content:space-between;align-items:center}
.brand{font-size:24px;font-weight:700}
.live{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--forest)}

.wrap{max-width:1120px;margin:0 auto;padding:0 24px}
.composer{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:32px}
.composer h1{font-size:clamp(28px,4.5vw,44px);line-height:1.05;margin:0 0 8px;font-weight:700}
.lede{color:var(--muted);max-width:58ch;margin:0 0 20px}
textarea,input{width:100%;font:inherit;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px}
textarea.say{font-size:20px;font-weight:500;line-height:1.4;padding:16px 18px;min-height:96px;resize:vertical}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 4px}
.chip{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:6px 14px;font:500 14px Figtree,system-ui,sans-serif;cursor:pointer}
.chip:hover{color:var(--ink);border-color:var(--muted)}
.sendto{display:grid;gap:6px;margin-top:16px;max-width:440px}
.sendto label{font-size:14px;color:var(--muted)}
.actions{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap;align-items:center}
.btn{background:var(--forest);color:var(--on-forest);border:0;border-radius:12px;padding:12px 22px;font:600 16px Figtree,system-ui,sans-serif;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn:disabled{opacity:.55;cursor:progress}
.link{background:none;border:0;color:var(--forest);font:600 14px Figtree,system-ui,sans-serif;cursor:pointer;padding:4px 0;text-decoration:underline;text-underline-offset:3px}

#out:not(:empty){margin-top:24px;padding-top:24px;border-top:1px solid var(--line)}
.take{display:grid;grid-template-columns:auto 1fr;gap:12px 32px;align-items:end}
.take .label{grid-column:1/-1;margin:0;color:var(--muted)}
.figure{font-size:clamp(52px,9vw,88px);font-weight:700;line-height:1;color:var(--forest);font-variant-numeric:tabular-nums}
.facts{margin:0;display:grid;gap:4px;font-size:15px}
.facts b{font-weight:600}
.err{color:var(--brick)}

.busy{display:flex;gap:18px;align-items:center}
.coin{flex:none;width:46px;height:46px;border-radius:50%;background:var(--saffron);color:#fff;display:grid;place-items:center;font-size:22px;font-weight:700;animation:spin 1.2s ease-in-out infinite}
@keyframes spin{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.08)}}
.busy-msg{margin:0;font-weight:600}
.busy-fact{margin:6px 0 0;color:var(--muted);font-size:14px;max-width:54ch;border-left:2px solid var(--saffron);padding-left:12px}

.grid{max-width:1120px;margin:44px auto 80px;padding:0 24px;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:48px}
.rail{border-left:1px solid var(--line);padding-left:32px}
@media (max-width:900px){.grid{grid-template-columns:1fr;gap:32px}.rail{border-left:0;border-top:1px solid var(--line);padding:28px 0 0}}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;font-weight:500;font-size:13px;color:var(--muted);padding:0 8px 10px 0;border-bottom:1px solid var(--line)}
td{padding:14px 8px 14px 0;border-bottom:1px solid var(--line);vertical-align:top}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
td.act{text-align:right;white-space:nowrap}
.client{max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.sub{font-size:12px;color:var(--muted)}
.st::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;background:var(--muted)}
.st-paid::before{background:var(--forest)}
.st-awaiting::before{background:var(--saffron)}
.st-overdue::before{background:var(--brick)}
.st-overdue{color:var(--brick);font-weight:600}
.empty{color:var(--muted);padding:28px 0}
tr.flash{animation:flash 3.5s ease}
@keyframes flash{0%,45%{background:var(--saffron-soft)}100%{background:transparent}}

.rail section+section{margin-top:32px}
.money{display:grid;grid-template-columns:1fr auto;gap:6px 12px;margin:0}
.money dt{color:var(--muted)}
.money dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.money dd.bad{color:var(--brick)}
.cur{font-size:13px;color:var(--muted);margin:14px 0 6px}
.people{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.people .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;background:var(--muted)}
.dot.good{background:var(--forest)!important}.dot.mid{background:var(--saffron)!important}.dot.bad{background:var(--brick)!important}
.people .who{display:inline-block;max-width:calc(100% - 20px);vertical-align:bottom;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.st{white-space:nowrap}
td.due{white-space:nowrap}
.people .what{color:var(--muted);font-size:14px;margin-left:16px}

.skel{height:14px;border-radius:6px;background:var(--line);animation:pulse 1.4s ease-in-out infinite;margin:10px 0}
@keyframes pulse{50%{opacity:.45}}

dialog{border:0;border-radius:18px;padding:28px;width:min(540px,92vw);background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(8,16,12,.5)}
dialog h2{margin-bottom:6px}
dialog input,dialog textarea{margin-top:10px}

#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);color:var(--paper);padding:12px 18px;border-radius:12px;max-width:min(520px,92vw);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:60}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.bad{background:var(--brick);color:#fff}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="bar" aria-hidden="true"></div>

<header class="top">
  <span class="brand">TakeHome</span>
  <span class="live"><i></i><span id="updated">Connecting…</span></span>
</header>

<div class="wrap">
  <section class="composer">
    <h1>What did you bill today?</h1>
    <p class="lede">Write it the way you'd say it. TakeHome turns it into an invoice and shows what you'll actually receive in rupees before anything is sent.</p>
    <textarea id="msg" class="say" rows="2" placeholder="Invoice Acme Corp $250 for the landing page design, due in 10 days" aria-label="Describe the invoice"></textarea>
    <div class="chips">
      <button class="chip" data-text="Invoice Acme Corp $250 for the landing page design, due in 10 days">Landing page, $250</button>
      <button class="chip" data-text="Bill Northwind $480 for two blog articles, due in 14 days">Two blog articles, $480</button>
    </div>
    <div class="sendto">
      <label for="email">Client's PayPal email</label>
      <input id="email" type="email" placeholder="Leave empty to use your test client">
    </div>
    <div class="actions"><button class="btn" id="previewBtn">Preview invoice</button></div>
    <div id="out" aria-live="polite"></div>
  </section>
</div>

<main class="grid">
  <section>
    <h2>Invoices</h2>
    <div class="tablewrap">
      <table>
        <thead><tr><th>Client</th><th>Amount</th><th>Due</th><th>Status</th><th></th></tr></thead>
        <tbody id="rows">
          <tr><td colspan="5"><div class="skel" style="width:70%"></div><div class="skel" style="width:55%"></div><div class="skel" style="width:62%"></div></td></tr>
        </tbody>
      </table>
    </div>
  </section>

  <aside class="rail">
    <section id="money"><h2>Money</h2><div class="skel" style="width:80%"></div><div class="skel" style="width:60%"></div></section>
    <section id="clients"><h2>Your clients</h2><div class="skel" style="width:75%"></div></section>
    <section id="chase"><h2>Chase first</h2><div class="skel" style="width:65%"></div></section>
  </aside>
</main>

<dialog id="dlg"><div id="dlgBody"></div></dialog>
<div id="toast" role="status" aria-live="polite"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const SYM = {USD:"$", EUR:"€", GBP:"£"};
const money = (a, c) => (SYM[c] || (c + " ")) + Number(a).toLocaleString("en-US", {minimumFractionDigits:2, maximumFractionDigits:2});
const inr = n => "₹" + Number(n).toLocaleString("en-IN");
const fmtDate = s => new Date(s + "T00:00:00").toLocaleDateString("en-IN", {day:"numeric", month:"short"});
const LABEL = {PAID:"Paid", MARKED_AS_PAID:"Paid", SENT:"Awaiting payment", UNPAID:"Awaiting payment", PARTIALLY_PAID:"Part paid", OVERDUE:"Overdue"};
const statusKey = s => (s === "PAID" || s === "MARKED_AS_PAID") ? "paid" : s === "OVERDUE" ? "overdue" : "awaiting";

/* ---------- requests (top bar shows for anything you start) ---------- */
let inflight = 0;
async function api(path, opts, quiet) {
  if (!quiet) { inflight++; document.body.classList.add("loading"); }
  try {
    const r = await fetch(path, opts);
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(typeof data.detail === "string" ? data.detail : JSON.stringify(data.detail || data));
    return data;
  } finally {
    if (!quiet && --inflight === 0) document.body.classList.remove("loading");
  }
}
const post = (path, body) => api(path, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)});

function toast(msg, kind) {
  const t = $("#toast"); t.textContent = msg; t.className = "show " + (kind || "");
  clearTimeout(toast.t); toast.t = setTimeout(() => t.className = "", 5000);
}

/* ---------- "working on it" panel ---------- */
const FACTS = [
  "The word invoice comes from an old French word meaning things sent.",
  "The ₹ sign became India's official rupee symbol in 2010. It blends the Devanagari letter र with the Latin R.",
  "PayPal's story began in 1998, under the name Confinity.",
  "Everything here runs on the PayPal sandbox, so no real money moves.",
  "A clear due date on every invoice is the simplest way to get paid on time.",
  "TakeHome never sends anything until you press the button. The AI only drafts."
];
function startBusy(el, steps) {
  let i = 0, f = Math.floor(Math.random() * FACTS.length);
  const t0 = Date.now();
  el.innerHTML = `<div class="busy" role="status"><div class="coin" aria-hidden="true">₹</div>
    <div><p class="busy-msg"></p><p class="busy-fact"></p></div></div>`;
  const msg = el.querySelector(".busy-msg"), fact = el.querySelector(".busy-fact");
  const paintMsg = () => {
    msg.textContent = Date.now() - t0 > 9000
      ? "Still working. The AI service is busy right now, so this can take a few more seconds."
      : steps[Math.min(i, steps.length - 1)];
  };
  const paintFact = () => { fact.textContent = FACTS[f++ % FACTS.length]; };
  paintMsg(); paintFact();
  const a = setInterval(() => { i++; paintMsg(); }, 2200);
  const b = setInterval(paintFact, 6000);
  return () => { clearInterval(a); clearInterval(b); };
}

/* ---------- create an invoice ---------- */
let parsed = null;
document.querySelectorAll(".chip").forEach(b => b.onclick = () => { $("#msg").value = b.dataset.text; $("#msg").focus(); });
$("#msg").addEventListener("keydown", e => { if ((e.ctrlKey || e.metaKey) && e.key === "Enter") runPreview(); });
$("#previewBtn").onclick = runPreview;

async function runPreview() {
  const message = $("#msg").value.trim();
  if (!message) { $("#msg").focus(); return; }
  const out = $("#out"), btn = $("#previewBtn");
  btn.disabled = true;
  const stop = startBusy(out, ["Reading your sentence", "Pulling out the amount, currency and due date", "Working out what lands in your bank"]);
  try {
    const d = await post("/preview", {message});
    stop(); parsed = d.parsed; showPreview(d);
  } catch (err) {
    stop();
    out.innerHTML = `<p class="err"><b>Couldn't preview that.</b> ${esc(err.message)}</p>`;
  }
  btn.disabled = false;
}

function countUp(el, to) {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) { el.textContent = inr(to); return; }
  const t0 = performance.now(), dur = 800;
  const tick = now => {
    const p = Math.min(1, (now - t0) / dur);
    el.textContent = inr(Math.round(to * (1 - Math.pow(1 - p, 3))));
    if (p < 1) requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}

function showPreview(d) {
  const p = d.parsed, e = d.estimate;
  $("#out").innerHTML = `
    <div class="take">
      <p class="label">You'd take home about</p>
      <div class="figure" id="figure">${inr(0)}</div>
      <p class="facts">
        <span><b>${esc(p.description)}</b> for ${esc(p.client_name)}</span>
        <span>${esc(money(p.amount, p.currency))}, due in ${esc(p.due_days)} days</span>
        <span class="muted">Fees and conversion take about ${esc(e.lost_percent)}%. PayPal converts at ₹${esc(e.paypal_rate_after_markup)} per ${esc(e.currency)}${e.rate_source === "fallback" ? " (saved rate, live rate unavailable)" : ""}. This is an estimate, your account's fees may differ.</span>
      </p>
    </div>
    <div class="actions">
      <button class="btn" id="sendBtn">Send invoice</button>
      <button class="btn ghost" id="cancelBtn">Cancel</button>
    </div>`;
  countUp($("#figure"), e.you_receive_inr);
  $("#cancelBtn").onclick = () => { $("#out").innerHTML = ""; };
  $("#sendBtn").onclick = sendInvoice;
}

async function sendInvoice() {
  const out = $("#out");
  const stop = startBusy(out, ["Creating the invoice on PayPal", "Sending it to your client", "Almost there"]);
  try {
    await post("/confirm-invoice", {
      description: parsed.description, amount: parsed.amount, currency: parsed.currency,
      due_days: parsed.due_days, client_email: $("#email").value.trim() || null
    });
    stop(); out.innerHTML = ""; $("#msg").value = "";
    toast("Invoice sent");
    refresh(true);
  } catch (err) {
    stop();
    out.innerHTML = `<p class="err"><b>Couldn't send the invoice.</b> ${esc(err.message)}</p>
      <div class="actions"><button class="btn ghost" id="cancelBtn">Close</button></div>`;
    $("#cancelBtn").onclick = () => { out.innerHTML = ""; };
  }
}

/* ---------- invoice list ---------- */
function dueText(i) {
  if (i.raw_status === "PAID" || i.raw_status === "MARKED_AS_PAID") {
    return i.paid_date ? "Paid on " + fmtDate(i.paid_date) : "Paid";
  }
  if (!i.due_date) return "No due date";
  const today = new Date(new Date().toDateString());
  const d = Math.round((new Date(i.due_date + "T00:00:00") - today) / 864e5);
  if (d < 0) return `${-d} day${d === -1 ? "" : "s"} late`;
  if (d === 0) return "Due today";
  return `in ${d} day${d === 1 ? "" : "s"}`;
}
function renderInvoices(list, justPaid) {
  const rows = list.filter(i => !["DRAFT", "CANCELLED"].includes(i.raw_status));
  if (!rows.length) {
    $("#rows").innerHTML = `<tr><td colspan="5" class="empty">No invoices yet. Describe one above and press Preview invoice.</td></tr>`;
    return;
  }
  $("#rows").innerHTML = rows.map(i => {
    const st = statusKey(i.status);
    return `<tr class="${justPaid.has(i.id) ? "flash" : ""}">
      <td><div class="client" title="${esc(i.client_email)}">${esc(i.client_email || "Unknown client")}</div>
          <div class="sub">${esc(i.id.replace("INV2-", ""))}</div></td>
      <td class="num">${esc(money(i.amount, i.currency))}</td>
      <td class="due" title="${esc(i.due_date || "")}">${esc(dueText(i))}</td>
      <td><span class="st st-${st}">${esc(LABEL[i.status] || i.status)}</span></td>
      <td class="act">${st !== "paid" ? `<button class="link" data-id="${esc(i.id)}">Draft reminder</button>` : ""}</td>
    </tr>`;
  }).join("");
}

/* ---------- side column ---------- */
function habit(c) {
  const a = c.avg_days_late;
  if (a == null) return ["No payment history yet", ""];
  if (a <= -1) return [`Pays about ${Math.round(-a)} days early`, "good"];
  if (a < 1) return ["Pays on the due date", "good"];
  return [`Pays about ${Math.round(a)} days late`, a > 5 ? "bad" : "mid"];
}
function renderRail(x) {
  const cur = Object.entries(x.totals);
  $("#money").innerHTML = `<h2>Money</h2>` + (cur.map(([c, t]) => `
    <p class="cur">${esc(c)}</p>
    <dl class="money">
      <dt>Waiting to be paid</dt><dd>${esc(money(t.outstanding, c))}</dd>
      <dt>Due this week</dt><dd>${esc(money(t.due_this_week, c))}</dd>
      <dt>Overdue</dt><dd class="${t.overdue > 0 ? "bad" : ""}">${esc(money(t.overdue, c))}</dd>
    </dl>`).join("") || `<p class="muted">Nothing outstanding.</p>`);

  const people = x.clients.filter(c => c.paid + c.open > 0);
  $("#clients").innerHTML = `<h2>Your clients</h2>` + (people.length ? `<ul class="people">` + people.map(c => {
    const [text, tone] = habit(c);
    return `<li><span class="dot ${tone}"></span><span class="who" title="${esc(c.client)}">${esc(c.client)}</span><div class="what">${esc(text)}</div></li>`;
  }).join("") + `</ul>` : `<p class="muted">Clients show up here after you send an invoice.</p>`);

  $("#chase").innerHTML = `<h2>Chase first</h2>` + (x.chase_first.length ? `<ul class="people">` + x.chase_first.map(c => `
    <li><span class="who" title="${esc(c.client)}">${esc(c.client)}</span>
      <div class="what">${c.reason === "overdue" ? `${c.days_overdue} day${c.days_overdue === 1 ? "" : "s"} overdue` : "This client usually pays late"}</div>
      <div class="what"><button class="link" data-id="${esc(c.id)}">Draft reminder</button></div></li>`).join("") + `</ul>`
    : `<p class="muted">Nothing to chase right now.</p>`);
}

/* ---------- reminders: AI drafts, you approve ---------- */
document.addEventListener("click", e => {
  const b = e.target.closest("button[data-id]");
  if (b) draftReminder(b.dataset.id);
  if (e.target.closest("[data-close]")) $("#dlg").close();
});
async function draftReminder(id) {
  const dlg = $("#dlg"), body = $("#dlgBody");
  dlg.showModal();
  let stop = startBusy(body, ["Reading the invoice", "Choosing the right tone", "Writing your draft"]);
  try {
    const d = await api("/reminder-draft/" + encodeURIComponent(id));
    stop();
    const when = d.days_overdue > 0 ? `${d.days_overdue} days overdue` : d.days_overdue === 0 ? "Due today" : `Due in ${-d.days_overdue} days`;
    body.innerHTML = `
      <h2>Reminder draft</h2>
      <p class="muted">${esc(when)}. Edit it if you like. Nothing is sent until you press Send reminder.</p>
      <input id="rSubject" value="${esc(d.draft.subject)}" aria-label="Subject">
      <textarea id="rNote" rows="5" aria-label="Message">${esc(d.draft.note)}</textarea>
      <div class="actions"><button class="btn" id="rSend">Send reminder</button><button class="btn ghost" data-close>Cancel</button></div>`;
    $("#rSend").onclick = async () => {
      const subject = $("#rSubject").value, note = $("#rNote").value;
      stop = startBusy(body, ["Sending your reminder"]);
      try {
        await post("/send-reminder", {invoice_id: id, subject, note});
        stop(); dlg.close(); toast("Reminder sent");
      } catch (err) {
        stop();
        body.innerHTML = `<h2>Couldn't send the reminder</h2><p class="err">${esc(err.message)}</p><div class="actions"><button class="btn ghost" data-close>Close</button></div>`;
      }
    };
  } catch (err) {
    stop();
    body.innerHTML = `<h2>Couldn't draft the reminder</h2><p class="err">${esc(err.message)}</p><div class="actions"><button class="btn ghost" data-close>Close</button></div>`;
  }
}

/* ---------- live updates ---------- */
let last = {};
async function refresh(force) {
  if (document.hidden && !force) return;
  try {
    const d = await api("/dashboard", undefined, true);
    const paidNow = d.invoices.filter(i => last[i.id] && last[i.id] !== "PAID" && i.status === "PAID");
    last = Object.fromEntries(d.invoices.map(i => [i.id, i.status]));
    renderInvoices(d.invoices, new Set(paidNow.map(i => i.id)));
    renderRail(d.insights);
    if (paidNow.length) {
      toast(paidNow.length === 1
        ? `Payment received: ${money(paidNow[0].amount, paidNow[0].currency)}`
        : `${paidNow.length} payments received`);
    }
    $("#updated").textContent = "Live, updated " + new Date().toLocaleTimeString();
  } catch (err) {
    $("#updated").textContent = "Couldn't update. Retrying.";
  }
}
refresh(true);
setInterval(refresh, 15000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
</script>
</body>
</html>
